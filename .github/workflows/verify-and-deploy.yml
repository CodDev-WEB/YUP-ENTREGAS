name: Verify and deploy YUP-ENTREGAS

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check JavaScript syntax
        run: |
          set -e
          for file in app.js auth-ui.js driver-access.js supabase-client.js supabase-config.js sw.js _worker.js; do
            node --check "$file"
          done
      - name: Validate Wrangler configuration
        run: node -e "JSON.parse(require('fs').readFileSync('wrangler.jsonc','utf8'))"
      - name: Check required app files and Supabase URL
        run: |
          set -e
          test -s index.html
          test -s app.js
          test -s supabase-client.js
          test -s supabase-config.js
          test -s _worker.js
          test -s supabase/schema.sql
          grep -q 'https://gswadshjadzobwhurxjc.supabase.co' supabase-config.js
      - name: Deploy Worker and static assets
        if: github.event_name != 'pull_request'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::warning::Cloudflare deploy skipped: configure CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID repository secrets."
            exit 0
          fi
          npx --yes wrangler@4 deploy --config wrangler.jsonc
