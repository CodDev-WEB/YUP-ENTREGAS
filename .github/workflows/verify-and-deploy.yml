name: Verify and deploy YUP-ENTREGAS

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Verify app and PWA assets
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check JavaScript syntax
        run: |
          set -e
          for file in app.js auth-ui.js driver-access.js supabase-client.js supabase-config.js sw.js _worker.js; do
            node --check "$file"
          done
      - name: Verify driver action bar and form contracts
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const app = fs.readFileSync('app.js', 'utf8');
          const checks = [
            ['start action uses fixed dock', app.includes('form="driverStartForm"')],
            ['new delivery submits from dock', app.includes('data-driver-submit="driverNewForm"')],
            ['occurrence submits from dock', app.includes('data-driver-submit="driverOccurrenceForm"')],
            ['journey finish submits from dock', app.includes('data-driver-submit="driverFinishForm"')],
            ['inline start button removed', !app.includes('class="driver-primary driver-start-cta" type="submit"')],
            ['duplicate inline end-journey button removed', !app.includes('data-driver-screen="summary">⚑　Encerrar jornada')],
            ['duplicate inline map link removed', !app.includes('Abrir destino no Maps')],
            ['logout action is available in driver header', app.includes('data-driver-logout')]
          ];
          for (const [label, passed] of checks) {
            console.log((passed ? 'PASS' : 'FAIL') + ' ' + label);
            if (!passed) process.exitCode = 1;
          }
          NODE
      - name: Validate Wrangler and PWA manifests
        run: |
          node -e "JSON.parse(require('fs').readFileSync('wrangler.jsonc','utf8'))"
          node -e "const fs=require('fs');const m=JSON.parse(fs.readFileSync('manifest.webmanifest','utf8'));if(m.display!=='standalone')throw Error('PWA must use standalone display');if(!m.icons?.length)throw Error('PWA icons are missing');for(const i of m.icons){if(!fs.existsSync(i.src.replace(/^\//,'')))throw Error('Missing PWA icon: '+i.src)}"
      - name: Check required files, links and public configuration
        run: |
          set -e
          for file in index.html app.js styles.css manifest.webmanifest sw.js _worker.js supabase-client.js supabase-config.js yup-brand.svg pwa-icon.svg supabase/schema.sql supabase/route-plans-migration.sql; do
            test -s "$file"
          done
          grep -q 'https://gswadshjadzobwhurjxc.supabase.co' supabase-config.js
          grep -q 'styles.css?v=61' index.html
          grep -q 'yup-brand.svg' app.js
          ! grep -Eiq 'service_role|SUPABASE_SERVICE_ROLE_KEY' index.html app.js auth-ui.js supabase-client.js supabase-config.js
          ! grep -Fq '\\n\\n\\n' index.html
      - name: Validate HTML asset references
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const html=fs.readFileSync('index.html','utf8');
          const refs=[...html.matchAll(/(?:src|href)="([^"]+)"/g)].map(m=>m[1]).filter(x=>!/^https?:|^#|^data:|^mailto:/.test(x));
          for(const ref of refs){
            const path=ref.split('?')[0].replace(/^\//,'');
            if(path && !fs.existsSync(path)) throw new Error('Missing local HTML asset: '+ref);
          }
          console.log('Local HTML assets verified:',refs.length);
          NODE
      - name: Validate Worker configuration with Wrangler
        run: npx --yes wrangler@4 deploy --config wrangler.jsonc --dry-run
  deploy:
    name: Deploy Cloudflare Worker
    needs: verify
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Deploy Worker and static assets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::Deployment was not performed. Configure CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID in repository Actions secrets."
            exit 1
          fi
          npx --yes wrangler@4 deploy --config wrangler.jsonc
